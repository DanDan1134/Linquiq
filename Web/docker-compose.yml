services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 1234
            POSTGRES_DB: connectwork
        ports:
            - "5432:5432"
        volumes:
            - ./data:/var/lib/postgresql
            # - ./init-scripts:/docker-entrypoint-initdb.d
    redis:
        image: redis:latest
        ports:
            - "6379:6379"
        volumes:
            - ./redis:/data
        command: redis-server --appendonly yes
        restart: always
volumes:
    data:
    redis:
